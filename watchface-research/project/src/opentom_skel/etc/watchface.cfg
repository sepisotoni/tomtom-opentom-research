# OpenTom Watchface Configuration
# Location: /mnt/sdcard/opentom/etc/watchface.cfg or /etc/watchface.cfg

# Layout mode:
# horizontal = side-by-side (HH : MM)
# stacked    = top-and-bottom (HH over MM)
layout=horizontal

# Time display mode:
# 12 = 12-hour format (01:00 - 12:59)
# 24 = 24-hour format (00:00 - 23:59)
time_format=12

# Display AM / PM badge in 12-hour mode:
# 1 = Display AM/PM
# 0 = Hide AM/PM
show_ampm=1

# Initial face to load on startup (0-4):
default_face=0
